services:
  postgres:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tracking_vehicles
    ports:
      # Port hôte 5434 (au lieu de 5432) : évite un conflit avec un Postgres déjà présent
      # sur la machine de dev. Le réseau interne Docker utilise toujours postgres:5432.
      # Concerne uniquement le port PUBLIÉ vers l'hôte de dev — sans impact sur le réseau
      # Docker interne (production comprise) ni sur le port en CI. Voir docs/PHASE1_NOTES.md.
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      # Port hôte 6380 (au lieu de 6379) pour la même raison ; interne : redis:6379.
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin123}
    command: server /data --console-address ":9001"
    ports:
      # Port hôte 9000 (API S3) / 9001 (console web). Réseau interne : minio:9000.
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      # `.env` est partagé entre `api` et `admin-web` (mêmes noms de variables PORT/NODE_ENV
      # possibles dans les deux, sens différent). Fixé explicitement ici pour ne jamais dépendre
      # de ce que contient `.env` : `environment:` a précédence sur `env_file:` dans Docker
      # Compose. Bug réel rencontré et corrigé pendant la vérification de cette phase (voir
      # docs/DEPLOYMENT.md) : sans ce fixage, un `PORT=3001` dans `.env` (destiné à `api`) fait
      # aussi écouter `admin-web` sur 3001 au lieu de 3000, cassant le routage nginx.
      PORT: "3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "3001:3001"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  admin-web:
    build:
      context: ./apps/admin-web
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      # Voir le commentaire équivalent sur le service `api` : évite qu'un PORT destiné à `api`
      # dans le `.env` partagé ne fasse écouter Next.js sur le mauvais port.
      PORT: "3000"
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000', r => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - api
      - admin-web
    volumes:
      - ./infrastructure/nginx:/etc/nginx/conf.d
    ports:
      - "80:80"
      - "443:443"

volumes:
  postgres_data:
  redis_data:
  minio_data:
