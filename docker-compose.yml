version: "3.9"

services:
  postgres:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tracking_vehicles
    ports:
      # Port hôte 5434 (au lieu de 5432) : évite un conflit avec un Postgres déjà présent
      # sur la machine de dev. Le réseau interne Docker utilise toujours postgres:5432.
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      # Port hôte 6380 (au lieu de 6379) pour la même raison ; interne : redis:6379.
      - "6380:6379"
    volumes:
      - redis_data:/data

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    depends_on:
      - postgres
      - redis
    ports:
      - "3001:3001"

  admin-web:
    build:
      context: ./apps/admin-web
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    depends_on:
      - api
    ports:
      - "3000:3000"

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - api
      - admin-web
    volumes:
      - ./infrastructure/nginx:/etc/nginx/conf.d
    ports:
      - "80:80"
      - "443:443"

volumes:
  postgres_data:
  redis_data:
