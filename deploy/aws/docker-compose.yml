# Stack de production AWS (EC2) : api NestJS + Postgres/PostGIS + Redis + MinIO derrière Caddy.
# L'admin-web est hébergé séparément (Cloudflare) : il n'est pas servi ici.
#
# Lancement (depuis la racine du repo sur le serveur) :
#   docker compose -f deploy/aws/docker-compose.yml --env-file deploy/aws/.env up -d --build
#
# Seul Caddy publie des ports (80/443) : Postgres, Redis, MinIO et l'api ne sont joignables que
# via le réseau Docker interne.
services:
  postgres:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: tracking_vehicles
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    # Les images officielles MinIO ne sont plus publiées (Docker Hub et Quay). Silo (pgsty/minio)
    # est un fork maintenu, compatible (même commande, mêmes données, `mc` inclus) ; version
    # épinglée pour ne jamais changer de stockage sans le décider.
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    # Image publiée par GitHub Actions (.github/workflows/deploy-api.yml) et mise à jour par
    # auto-deploy.sh. `build` reste disponible pour un déploiement manuel de secours :
    # `docker compose ... up -d --build api`.
    image: ghcr.io/bofilubala/vehicles-tracking-api:latest
    build:
      context: ../../apps/api
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: "3001"
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/tracking_vehicles?schema=public
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      caddy:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # HTTPS automatique (Let's Encrypt) pour API_DOMAIN et FILES_DOMAIN.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      API_DOMAIN: ${API_DOMAIN}
      FILES_DOMAIN: ${FILES_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./public:/srv/public:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  postgres_data:
  redis_data:
  minio_data:
  caddy_data:
  caddy_config:
