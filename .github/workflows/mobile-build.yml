name: Mobile deploy (EAS)

# Livraison continue de l'application mobile, sans poste de développeur.
#
# Automatique, à chaque push sur main touchant apps/mobile (tests verts), canal PRODUCTION :
#   - seul le JavaScript a changé  -> mise à jour OTA (EAS Update, branche `production`) : les
#     utilisateurs Play Store la reçoivent au prochain lancement, sans nouvelle version store ;
#   - le code natif a changé (empreinte « fingerprint » différente) -> nouvel AAB `production`
#     (versionCode incrémenté) construit dans le cloud Expo et, si la variable de dépôt
#     PLAY_AUTO_SUBMIT vaut `true`, envoyé au Play Console (piste `internal`, voir eas.json).
#
# Retour arrière d'une mise à jour OTA : `eas update:rollback` (ou republier l'ancienne).
# Manuel (Run workflow) : build à la demande.
#
# Prérequis : secret EXPO_TOKEN ; variables EXPO_PUBLIC_* dans l'environnement EAS `production` ;
# pour l'envoi automatique : clé de compte de service Google Play déposée sur expo.dev
# (Credentials -> Android -> Google Service Account Key) puis variable PLAY_AUTO_SUBMIT=true.

on:
  push:
    branches: [main]
    paths: ['apps/mobile/**', '.github/workflows/mobile-build.yml']
  workflow_dispatch:
    inputs:
      profile:
        description: Build manuel
        type: choice
        options: [production]
        default: production

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: mobile-deploy
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck && npm test

  continuous-deploy:
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci
        working-directory: apps/mobile
      - name: OTA update, ou nouvel AAB Play Store si le natif a changé
        uses: expo/expo-github-action/continuous-deploy-fingerprint@main
        with:
          working-directory: apps/mobile
          profile: production
          branch: production
          environment: production
          platform: android
          auto-submit-builds: ${{ vars.PLAY_AUTO_SUBMIT == 'true' }}

  manual-build:
    if: github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci
      - name: 'Build EAS (suivi sur expo.dev)'
        run: eas build --platform android --non-interactive --no-wait --profile "${{ inputs.profile }}"
