name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  api-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tracking_vehicles_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tracking_vehicles_test
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: test-access-secret
      JWT_REFRESH_SECRET: test-refresh-secret
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 30d
      QR_TOKEN_SECRET: test-qr-secret
      OTP_CHANNEL_MODE: stub
      DEMO_ADMIN_EMAIL: admin@demo.local
      DEMO_ADMIN_PASSWORD: ChangeMe123
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
        working-directory: apps/api
      - run: npx prisma migrate deploy
        working-directory: apps/api
      - run: npx prisma db seed
        working-directory: apps/api
      - run: npm run test
        working-directory: apps/api

  # admin-web-build: re-add once apps/admin-web has real dependencies and a lockfile
  # (it's currently an empty scaffold — package.json references Next.js scripts but
  # has no dependencies installed, so `npm ci` / `npm run build` can't succeed yet).
