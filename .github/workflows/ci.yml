name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  api-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tracking_vehicles_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      minio:
        # L'image officielle minio/minio exige des arguments de commande ("server /data"), que les
        # "services" GitHub Actions ne permettent pas de fournir (seuls image/env/ports/options sont
        # configurables, pas command/entrypoint). On utilise donc bitnami/minio, qui démarre le
        # serveur uniquement via variables d'environnement — même API S3 sur le port 9000.
        image: bitnami/minio:latest
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin123
          MINIO_DEFAULT_BUCKETS: tracking-vehicles
        ports:
          - 9000:9000
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tracking_vehicles_test
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: test-access-secret
      JWT_REFRESH_SECRET: test-refresh-secret
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 30d
      QR_TOKEN_SECRET: test-qr-secret
      OTP_CHANNEL_MODE: stub
      DEMO_ADMIN_EMAIL: admin@demo.local
      DEMO_ADMIN_PASSWORD: ChangeMe123
      S3_ENDPOINT: http://localhost:9000
      S3_BUCKET: tracking-vehicles
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin123
      S3_REGION: us-east-1
      S3_FORCE_PATH_STYLE: "true"
      FILE_SIGNED_URL_TTL_SECONDS: 600
      MAX_GPS_ACCURACY_METERS: 100
      MAX_PLAUSIBLE_SPEED_KMH: 150
      VEHICLE_OFFLINE_THRESHOLD_MINUTES: 5
      MAX_PLAUSIBLE_FUEL_CONSUMPTION_L_PER_100KM: 40
      MIN_HOURS_BETWEEN_FUEL_RECORDS: 2
      CORS_ALLOWED_ORIGINS: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - run: npm ci
        working-directory: apps/api
      - name: Attendre que MinIO réponde
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:9000/minio/health/live > /dev/null; then
              echo "MinIO prêt"
              exit 0
            fi
            sleep 2
          done
          echo "MinIO n'a pas répondu à temps" >&2
          exit 1
      - run: npx prisma migrate deploy
        working-directory: apps/api
      - run: npx prisma db seed
        working-directory: apps/api
      - run: npm run test
        working-directory: apps/api

  admin-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/admin-web
    env:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:3001/api/v1
      NEXT_PUBLIC_API_WS_URL: http://localhost:3001
      NEXT_PUBLIC_MAP_STYLE_URL: https://demotiles.maplibre.org/style.json
      API_BASE_URL: http://localhost:3001/api/v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/admin-web/package-lock.json
      - run: npm ci
      - run: npx vitest run
      - run: npm run build

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
