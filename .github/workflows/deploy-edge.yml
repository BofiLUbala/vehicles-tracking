name: Deploy Cloudflare Worker

# Publie le Worker `track` (deploy/cloudflare) : adresse HTTPS publique et courte de l'admin web,
# https://track.<sous-domaine-du-compte>.workers.dev.
# Secrets requis : CLOUDFLARE_API_TOKEN (modèle « Edit Cloudflare Workers ») et CLOUDFLARE_ACCOUNT_ID.

on:
  push:
    branches: [main]
    paths: ['deploy/cloudflare/**', '.github/workflows/deploy-edge.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Vérifier la présence des secrets Cloudflare
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$ACCOUNT" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID absents : Worker non déployé."
            echo "skip=true" >> "$GITHUB_ENV"
          fi
      - uses: cloudflare/wrangler-action@v3
        if: env.skip != 'true'
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: deploy/cloudflare
          command: deploy
