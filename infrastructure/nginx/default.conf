#      ou tout autre moyen — ACME DNS-01, certificat acheté, etc.).
#   2. Monter le certificat et la clé dans le conteneur nginx (volume Docker), ex. dans
#      docker-compose.yml :
#        nginx:
#          volumes:
#            - ./infrastructure/nginx:/etc/nginx/conf.d
#            - /etc/letsencrypt/live/votre-domaine.example:/etc/nginx/certs:ro
#   3. Décommenter le bloc ci-dessous (et adapter server_name / chemins de certificat), puis
#      décommenter le `return 301` dans le bloc `listen 80` au-dessus pour forcer la redirection.
