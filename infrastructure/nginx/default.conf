# Reverse-proxy pour la stack tracking-vehicles.
#
# Routage :
#   /api/v1/*      -> service api (NestJS, `setGlobalPrefix('api/v1', ...)`, voir
#                     apps/api/src/main.ts). Le préfixe est PRÉSERVÉ tel quel vers l'amont (pas
#                     de proxy_pass avec URI de destination différent) — un
#                     `proxy_pass http://api:3001/;` (avec le `/` final) aurait au contraire
#                     *retiré* `/api/v1/` avant de transmettre, cassant toutes les routes (404).
#                     Vérifié par test réel bout en bout (voir docs/DEPLOYMENT.md).
#   /api/auth/*    -> service admin-web (PAS l'api NestJS). Ce sont des Route Handlers internes
#                     à Next.js (apps/admin-web/src/app/api/auth/*), appelés en relatif par le
#                     navigateur (`fetch('/api/auth/login')`, voir
#                     apps/admin-web/src/features/auth/api.ts et src/lib/api-client.ts) pour
#                     poser/rafraîchir les cookies de session httpOnly. Bug réel trouvé et corrigé
#                     pendant la vérification de cette phase : ces chemins commencent par `/api/`
#                     mais ne font PAS partie de l'api NestJS (qui n'a rien sous `/api/auth/...`,
#                     seulement `/api/v1/auth/...`) — avec un unique bloc générique `/api/` pointant
#                     vers le service `api`, ces requêtes atterrissaient sur l'api NestJS et
#                     recevaient 404, cassant complètement la connexion admin en passant par nginx
#                     (testé et confirmé en conditions réelles, voir docs/DEPLOYMENT.md). D'où la
#                     séparation explicite `/api/v1/` (api) vs `/api/auth/` et `/api/reports/`
#                     (admin-web) au lieu d'un simple `/api/`.
#   /api/reports/* -> service admin-web, même raison : proxy interne Next.js pour le
#                     téléchargement de rapports avec vérification de session (voir
#                     apps/admin-web/src/app/api/reports/*/route.ts et src/lib/reports-proxy.ts).
#   /socket.io/*   -> service api (Socket.IO — passerelle WebSocket namespace `/tracking`,
#                     voir apps/api/src/tracking/tracking.gateway.ts). Le namespace Socket.IO
#                     ("/tracking") est négocié par le client dans la query string de la
#                     poignée de main HTTP envoyée à /socket.io/ ; le chemin HTTP proxifié
#                     reste /socket.io/, pas /tracking/.
#   /*             -> service admin-web (Next.js), catch-all (couvre aussi les autres routes
#                     internes Next.js sous /api/, ex. NextAuth-like handlers futurs)
#
# Ce fichier sert de config HTTP "dev" (utilisée telle quelle par docker-compose.yml, plain
# HTTP sur :80, adapté à un usage local/interne). Le bloc HTTPS ci-dessous est un gabarit
# commenté pour la production — voir instructions en bas de fichier.

server {
    listen 80;
    server_name _;

    # Décommenter en production une fois le certificat TLS en place (voir bloc HTTPS plus bas),
    # pour rediriger tout le trafic HTTP en clair vers HTTPS :
    # return 301 https://$host$request_uri;

    # Route Handlers internes Next.js (cookies de session httpOnly, proxy de téléchargement de
    # rapports) : DOIVENT être routés vers admin-web, pas vers l'api NestJS. Placés avant le
    # bloc générique `/api/v1/` — nginx choisit de toute façon le préfixe le plus long/spécifique,
    # mais l'ordre est gardé explicite ici pour la lisibilité.
    location /api/auth/ {
        proxy_pass http://admin-web:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/reports/ {
        proxy_pass http://admin-web:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/v1/ {
        # Pas de chemin après le nom d'hôte dans proxy_pass : nginx transmet l'URI d'origine
        # telle quelle (/api/v1/... reste /api/v1/... côté api), au lieu de le réécrire.
        proxy_pass http://api:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # /health n'est pas préfixé par api/v1 côté NestJS (voir main.ts `setGlobalPrefix(... exclude:
    # ['health'])`) ; exposé ici sous /health directement (utile pour un load balancer / uptime
    # check devant nginx, distinct du healthcheck interne Docker qui appelle l'api directement).
    location = /health {
        proxy_pass http://api:3001/health;
        proxy_set_header Host $host;
    }

    location /socket.io/ {
        proxy_pass http://api:3001/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Les connexions WebSocket sont longue durée : désactiver le timeout de lecture par
        # défaut (60s) qui couperait un socket de suivi GPS inactif entre deux positions.
        proxy_read_timeout 3600s;
    }

    location / {
        proxy_pass http://admin-web:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

