name: tracking_vehicles_mobile
description: Application chauffeur — suivi des véhicules de collecte (Kinshasa)
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  dio: ^5.4.3
  drift: ^2.16.0
  sqlite3_flutter_libs: ^0.5.20
  geolocator: ^11.0.0
  mobile_scanner: ^5.0.0
  camera: ^0.10.5
  socket_io_client: ^2.0.3
  flutter_secure_storage: ^9.0.0
  firebase_messaging: ^14.7.10
  firebase_core: ^2.24.2
  maplibre_gl: ^0.19.0
  uuid: ^4.4.0
  connectivity_plus: ^6.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  drift_dev: ^2.16.0
  build_runner: ^2.4.9
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
